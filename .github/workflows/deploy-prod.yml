name: Deploy Prod

on:
  push:
    branches:
      - github_actions
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: true

jobs:
  deploy-prod:
    name: Build and deploy prod
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
          cache: maven
          overwrite-settings: false

      - name: Install jugg dependencies
        run: |
          git clone --depth 1 --branch main https://github.com/bogewang/jugg.git "$RUNNER_TEMP/jugg"
          mvn -f "$RUNNER_TEMP/jugg/pom.xml" clean install -DskipTests

      - name: Build backend
        working-directory: backend
        run: mvn clean package -Pprod -DskipTests -pl xingyun-api -am

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Package frontend
        run: tar -czf frontend-dist.tar.gz -C frontend dist

      - name: Install COSCLI
        run: |
          coscli_sha256=7165f2ae16c5f7ac495864c963ca574a76e04ec72680d7bc8a8eee3234d8cf91
          for attempt in 1 2 3; do
            curl --fail --location --connect-timeout 15 --max-time 300 \
              --output "$RUNNER_TEMP/coscli" \
              https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64 && break
            if [ "$attempt" = 3 ]; then
              exit 1
            fi
            sleep 5
          done
          echo "$coscli_sha256  $RUNNER_TEMP/coscli" | sha256sum --check --status
          chmod 755 "$RUNNER_TEMP/coscli"

      - name: Upload artifacts to COS
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          umask 077
          config_file="$RUNNER_TEMP/coscli.yaml"
          cat > "$config_file" <<EOF
          cos:
            base:
              secretid: $COS_SECRET_ID
              secretkey: $COS_SECRET_KEY
              sessiontoken: ""
              protocol: https
            buckets:
            - name: $COS_BUCKET
              alias: deploy
              region: $COS_REGION
              endpoint: cos.accelerate.myqcloud.com
              ofs: false
          EOF
          "$RUNNER_TEMP/coscli" -c "$config_file" cp backend/xingyun-api/target/xingyun-api.jar "cos://deploy/xingyun/prod/$RELEASE_ID/xingyun-api.jar"
          "$RUNNER_TEMP/coscli" -c "$config_file" cp frontend-dist.tar.gz "cos://deploy/xingyun/prod/$RELEASE_ID/frontend-dist.tar.gz"

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "${{ secrets.PROD_SSH_PORT }}" "${{ secrets.PROD_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Prepare remote directories
        run: |
          ssh -p "${{ secrets.PROD_SSH_PORT }}" -i ~/.ssh/deploy_key "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" '
            set -e
            umask 0002
            mkdir -p /www/wwwroot/xingyun/data/tmp
            mkdir -p /www/wwwroot/xingyun/data/upload
            mkdir -p /www/wwwroot/xingyun/data/security-upload
            chmod 775 /www/wwwroot/xingyun
            chmod -R 775 /www/wwwroot/xingyun/data
          '

      - name: Restart prod services
        env:
          COS_SECRET_ID: ${{ secrets.COS_SECRET_ID }}
          COS_SECRET_KEY: ${{ secrets.COS_SECRET_KEY }}
          COS_BUCKET: ${{ secrets.COS_BUCKET }}
          COS_REGION: ${{ secrets.COS_REGION }}
          RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/coscli.yaml"' EXIT
          cos_config_base64="$(base64 --wrap=0 "$RUNNER_TEMP/coscli.yaml")"
          ssh -p "${{ secrets.PROD_SSH_PORT }}" -i ~/.ssh/deploy_key "${{ secrets.PROD_SSH_USER }}@${{ secrets.PROD_SSH_HOST }}" "config_file=\$(mktemp --suffix=.yaml); trap 'rm -f \"\$config_file\"' EXIT; umask 077; printf '%s' '$cos_config_base64' | base64 --decode > \$config_file; chmod 600 \$config_file; exec bash -s \$config_file '$RELEASE_ID'" <<'REMOTE'
            set -e
            umask 0002
            cd /www/wwwroot/xingyun
            config_file="$1"
            release_id="$2"
            coscli_binary=""
            coscli_path=/www/wwwroot/xingyun/bin/coscli
            trap 'rm -f "$config_file" "$coscli_binary"' EXIT
            if [ ! -x "$coscli_path" ]; then
              coscli_sha256=7165f2ae16c5f7ac495864c963ca574a76e04ec72680d7bc8a8eee3234d8cf91
              coscli_binary="$(mktemp)"
              mkdir -p "$(dirname "$coscli_path")"
              for attempt in 1 2 3; do
                curl --fail --location --connect-timeout 15 --max-time 300 \
                  --output "$coscli_binary" \
                  https://cosbrowser.cloud.tencent.com/software/coscli/coscli-linux-amd64 && break
                if [ "$attempt" = 3 ]; then
                  exit 1
                fi
                sleep 5
              done
              echo "$coscli_sha256  $coscli_binary" | sha256sum --check --status
              install -m 755 "$coscli_binary" "$coscli_path"
            fi
            "$coscli_path" -c "$config_file" cp "cos://deploy/xingyun/prod/$release_id/xingyun-api.jar" xingyun-api.jar.new
            "$coscli_path" -c "$config_file" cp "cos://deploy/xingyun/prod/$release_id/frontend-dist.tar.gz" frontend-dist.tar.gz.new
            mv frontend-dist.tar.gz.new frontend-dist.tar.gz
            rm -rf dist.new
            mkdir -p dist.new
            tar -xzf frontend-dist.tar.gz -C dist.new
            rm -rf dist
            mv dist.new/dist dist
            rm -rf dist.new
            mv xingyun-api.jar.new xingyun-api-81.jar
            chmod 664 xingyun-api-81.jar frontend-dist.tar.gz
            chmod -R 775 dist
            sudo /usr/bin/systemctl restart xingyun-api-prod
            sudo /www/server/nginx/sbin/nginx -s reload
          REMOTE
