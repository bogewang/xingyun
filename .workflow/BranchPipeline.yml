- step: build@maven
  name: deploy_server
  displayName: 上传并重启服务
  jdkVersion: 8
  mavenVersion: 3.6.3
  commands:
    - set -e
    - SSH_HOST=47.103.125.229
    - SSH_USER=www
    - SSH_DIR=/www/wwwroot/xingyun

    # 生成 SSH 密钥
    - mkdir -p /root/.ssh
    - echo "-----BEGIN OPENSSH PRIVATE KEY-----" > /root/.ssh/id_rsa
    - echo "b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW" >> /root/.ssh/id_rsa
    - echo "QyNTUxOQAAACBS0dtv80fNFp1csUFk79rEuWagiDS37UWdPWXiLr252AAAAKBOlxGvTpcR" >> /root/.ssh/id_rsa
    - echo "rwAAAAtzc2gtZWQyNTUxOQAAACBS0dtv80fNFp1csUFk79rEuWagiDS37UWdPWXiLr252A" >> /root/.ssh/id_rsa
    - echo "AAAEBi+I/kAE2Hv9bfT0XtAsVUOZ0aOOyFzsaAuQQkZNjgX1LR22/zR80WnVyxQWTv2sS5" >> /root/.ssh/id_rsa
    - echo "ZqCINLftRZ09ZeIuvbnYAAAAGmdpdGh1Yi1hY3Rpb25zLXhpbmd5dW4td3d3AQID" >> /root/.ssh/id_rsa
    - echo "-----END OPENSSH PRIVATE KEY-----" >> /root/.ssh/id_rsa
    - chmod 600 /root/.ssh/id_rsa

    # 加入主机信任
    - ssh-keyscan -H $SSH_HOST >> /root/.ssh/known_hosts

    # 上传 jar
    - scp -v -o StrictHostKeyChecking=no backend/xingyun-api/target/xingyun-api-1.0.0-SNAPSHOT.jar $SSH_USER@$SSH_HOST:$SSH_DIR/

    # 上传前端 dist
    - ssh $SSH_USER@$SSH_HOST "mkdir -p $SSH_DIR/dist"
    - scp -v -r -o StrictHostKeyChecking=no frontend/dist/* $SSH_USER@$SSH_HOST:$SSH_DIR/dist/

    # 重启服务
    - ssh $SSH_USER@$SSH_HOST "systemctl daemon-reload && systemctl restart xingyun-api"