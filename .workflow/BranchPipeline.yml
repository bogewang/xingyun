version: '1.0'
name: xingyun-branch-ci
displayName: 星云ERP分支构建

triggers:
  push:
    branches:
      precise:
        - deploy
  pr:
    branches:
      precise:
        - deploy

stages:
  - name: deploy
    displayName: 构建并部署到测试服务器
    strategy: fast
    trigger: push
    steps:
      - step: build@maven
        name: deploy_server
        displayName: 编译、上传并重启服务
        jdkVersion: 8
        mavenVersion: 3.6.3
        commands:
          - set -e
          # ===== 后端编译 =====
          - export MAVEN_REPO=$PWD/.m2/repository
          - rm -rf .gitee-go-jugg
          - git clone --depth 1 --branch master https://gitee.com/foren236598164/jugg .gitee-go-jugg
          - mvn -B -N -f .gitee-go-jugg/pom.xml clean install -DskipTests -Dmaven.repo.local=$MAVEN_REPO
          - mvn -B -U -f .gitee-go-jugg/pom.xml clean install -DskipTests -Dmaven.repo.local=$MAVEN_REPO
          - mvn -B -U -f backend/pom.xml clean package -DskipTests -Dmaven.repo.local=$MAVEN_REPO
          - ls -lh backend/xingyun-api/target/
          # ===== 前端编译（在 Maven 容器内安装 Node.js）=====
          - export NODEJS_HOME=$PWD/.node-v18.20.4
          - wget -q https://npmmirror.com/mirrors/node/v18.20.4/node-v18.20.4-linux-x64.tar.xz -O node-v18.20.4-linux-x64.tar.xz
          - mkdir -p $NODEJS_HOME
          - tar -xJf node-v18.20.4-linux-x64.tar.xz -C $NODEJS_HOME --strip-components=1
          - export PATH=$NODEJS_HOME/bin:$PATH
          - node -v
          - npm -v
          - npm config set registry https://registry.npmmirror.com
          - npm install -g pnpm@9.15.0
          - cd frontend
          - pnpm config set registry https://registry.npmmirror.com
          - pnpm install --frozen-lockfile
          - pnpm run build
          - ls -lh dist/
          - cd ..
          # ===== 部署：上传 JAR + 前端 + 重启服务 =====
          - mkdir -p /root/.ssh
          - echo "-----BEGIN OPENSSH PRIVATE KEY-----" > /root/.ssh/id_rsa
          - echo "b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW" >> /root/.ssh/id_rsa
          - echo "QyNTUxOQAAACBS0dtv80fNFp1csUFk79rEuWagiDS37UWdPWXiLr252AAAAKBOlxGvTpcR" >> /root/.ssh/id_rsa
          - echo "rwAAAAtzc2gtZWQyNTUxOQAAACBS0dtv80fNFp1csUFk79rEuWagiDS37UWdPWXiLr252A" >> /root/.ssh/id_rsa
          - echo "AAAEBi+I/kAE2Hv9bfT0XtAsVUOZ0aOOyFzsaAuQQkZNjgX1LR22/zR80WnVyxQWTv2sS5" >> /root/.ssh/id_rsa
          - echo "ZqCINLftRZ09ZeIuvbnYAAAAGmdpdGh1Yi1hY3Rpb25zLXhpbmd5dW4td3d3AQID" >> /root/.ssh/id_rsa
          - echo "-----END OPENSSH PRIVATE KEY-----" >> /root/.ssh/id_rsa
          - chmod 600 /root/.ssh/id_rsa
          - ssh-keyscan -H 47.103.125.229 >> /root/.ssh/known_hosts
          - scp -v -o StrictHostKeyChecking=no backend/xingyun-api/target/xingyun-api.jar www@47.103.125.229:/www/wwwroot/xingyun/xingyun-api.jar.new
          - ssh www@47.103.125.229 "mkdir -p /www/wwwroot/xingyun/dist"
          - scp -v -r -o StrictHostKeyChecking=no frontend/dist/* www@47.103.125.229:/www/wwwroot/xingyun/dist/
          - ssh www@47.103.125.229 "systemctl daemon-reload && systemctl restart xingyun-api"
