version: '1.0'
name: xingyun-branch-ci
displayName: 星云ERP分支构建

triggers:
  push:
    branches:
      precise:
        - deploy
  pr:
    branches:
      precise:
        - deploy

# 缓存：极大加速构建
caches:
  - path: .m2/repository
  - path: .node-v18.20.4
  - path: frontend/node_modules

stages:
  - name: build
    displayName: 构建校验
    strategy: fast
    trigger: auto
    steps:
      # ================== 后端构建 ==================
      - step: build@maven
        name: backend_build
        displayName: 后端编译
        jdkVersion: 8
        mavenVersion: 3.6.3
        commands:
          - set -e
          - export MAVEN_REPO=$PWD/.m2/repository

          # 克隆依赖项目（只一次）
          - |
            if [ ! -d ".gitee-go-jugg" ]; then
              git clone --depth 1 --branch master https://gitee.com/foren236598164/jugg .gitee-go-jugg
            fi
          - mvn -B -f .gitee-go-jugg/pom.xml clean install -DskipTests -Dmaven.repo.local=$MAVEN_REPO

          # 校验依赖包是否存在
          - test -f $MAVEN_REPO/com/lframework/parent/4.1.2-SNAPSHOT/parent-4.1.2-SNAPSHOT.pom
          - test -f $MAVEN_REPO/com/lframework/mq-starter/4.1.2-SNAPSHOT/mq-starter-4.1.2-SNAPSHOT.pom

          # 后端打包
          - mvn -B -f backend/pom.xml clean package -DskipTests -Dmaven.repo.local=$MAVEN_REPO

      # ================== 前端构建 ==================
      - step: build@nodejs
        name: frontend_build
        displayName: 前端检查与构建
        nodeVersion: 18.20.4
        commands:
          - set -e
          - npm config set registry https://registry.npmmirror.com
          - npm install -g pnpm@9.15.0

          - cd frontend
          - pnpm config set registry https://registry.npmmirror.com
          - pnpm install --frozen-lockfile
          - pnpm run lint
          - pnpm run build

  # ================== 部署阶段（仅 push 触发） ==================
  - name: deploy
    displayName: 部署到测试服务器
    strategy: fast
    trigger: push
    steps:
      - step: publish@general
        name: deploy_all
        displayName: 前后端部署
        commands:
          - set -e

          # 从缓存/工作区直接使用已构建好的产物
          # 服务器信息
          - export SSH_TEST_HOST=47.103.125.229
          - export SSH_TEST_USER=www

          # 写入 SSH 私钥（建议替换为环境变量！！！）
          - mkdir -p ~/.ssh
          - echo "${SSH_PRIVATE_KEY}" | base64 -d > ~/.ssh/id_rsa
          - chmod 600 ~/.ssh/id_rsa

          # 部署后端
          - scp -o StrictHostKeyChecking=no backend/xingyun-api/target/xingyun-api.jar ${SSH_TEST_USER}@${SSH_TEST_HOST}:/www/wwwroot/xingyun/
          - ssh -o StrictHostKeyChecking=no ${SSH_TEST_USER}@${SSH_TEST_HOST} "systemctl restart xingyun-api"

          # 部署前端
          - ssh -o StrictHostKeyChecking=no ${SSH_TEST_USER}@${SSH_TEST_HOST} "mkdir -p /www/wwwroot/xingyun/dist"
          - scp -o StrictHostKeyChecking=no -r frontend/dist/* ${SSH_TEST_USER}@${SSH_TEST_HOST}:/www/wwwroot/xingyun/dist/
          - ssh -o StrictHostKeyChecking=no ${SSH_TEST_USER}@${SSH_TEST_HOST} "sudo /www/server/nginx/sbin/nginx -s reload"