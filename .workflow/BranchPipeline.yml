version: '1.0'
name: xingyun-branch-ci
displayName: 星云ERP分支构建

triggers:
  push:
    branches:
      precise:
        - deploy
  pr:
    branches:
      precise:
        - deploy

stages:
  - name: build
    displayName: 构建校验
    strategy: fast
    trigger: auto
    steps:
      - step: build@maven
        name: backend_build
        displayName: 后端编译
        jdkVersion: 8
        mavenVersion: 3.6.3
        commands:
          - set -e
          - export MAVEN_REPO=$PWD/.m2/repository
          - rm -rf .gitee-go-jugg
          - git clone --depth 1 --branch master https://gitee.com/foren236598164/jugg .gitee-go-jugg
          - mvn -B -N -f .gitee-go-jugg/pom.xml clean install -DskipTests -Dmaven.repo.local=$MAVEN_REPO
          - mvn -B -U -f .gitee-go-jugg/pom.xml clean install -DskipTests -Dmaven.repo.local=$MAVEN_REPO
          - find $MAVEN_REPO/com/lframework -maxdepth 4 -type f | sort
          - test -f $MAVEN_REPO/com/lframework/parent/4.1.2-SNAPSHOT/parent-4.1.2-SNAPSHOT.pom
          - test -f $MAVEN_REPO/com/lframework/mq-starter/4.1.2-SNAPSHOT/mq-starter-4.1.2-SNAPSHOT.pom
          - mvn -B -U -f backend/pom.xml clean package -DskipTests -Dmaven.repo.local=$MAVEN_REPO

      - step: build@nodejs
        name: frontend_build
        displayName: 前端检查与构建
        nodeVersion: 14.16.0
        commands:
          - export NODEJS_HOME=$PWD/.node-v18.20.4
          - wget -q https://npmmirror.com/mirrors/node/v18.20.4/node-v18.20.4-linux-x64.tar.xz -O node-v18.20.4-linux-x64.tar.xz
          - mkdir -p $NODEJS_HOME
          - tar -xJf node-v18.20.4-linux-x64.tar.xz -C $NODEJS_HOME --strip-components=1
          - export PATH=$NODEJS_HOME/bin:$PATH
          - node -v
          - npm -v
          - npm config set registry https://registry.npmmirror.com
          - npm install -g pnpm@9.15.0
          - cd frontend
          - pnpm config set registry https://registry.npmmirror.com
          - pnpm install --frozen-lockfile
          - pnpm run lint
          - pnpm run build

  - name: deploy
    displayName: 构建并部署到测试服务器
    strategy: fast
    trigger: push
    steps:
      - step: build@maven
        name: backend_deploy
        displayName: 后端构建与部署
        jdkVersion: 8
        mavenVersion: 3.6.3
        commands:
          - set -e
          # 构建后端 JAR
          - export MAVEN_REPO=$PWD/.m2/repository
          - rm -rf .gitee-go-jugg
          - git clone --depth 1 --branch master https://gitee.com/foren236598164/jugg .gitee-go-jugg
          - mvn -B -N -f .gitee-go-jugg/pom.xml clean install -DskipTests -Dmaven.repo.local=$MAVEN_REPO
          - mvn -B -U -f .gitee-go-jugg/pom.xml clean install -DskipTests -Dmaven.repo.local=$MAVEN_REPO
          - mvn -B -U -f backend/pom.xml clean package -DskipTests -Dmaven.repo.local=$MAVEN_REPO
          # SSH 配置与部署
          - export SSH_TEST_HOST=47.103.125.229
          - export SSH_TEST_USER=www
          - mkdir -p ~/.ssh
          - echo "" | base64 -d > ~/.ssh/id_rsa
          - chmod 600 ~/.ssh/id_rsa
          - scp -o StrictHostKeyChecking=no backend/xingyun-api/target/xingyun-api.jar $SSH_TEST_USER@$SSH_TEST_HOST:/www/wwwroot/xingyun/
          - ssh -o StrictHostKeyChecking=no $SSH_TEST_USER@$SSH_TEST_HOST "systemctl restart xingyun-api"

      - step: build@nodejs
        name: frontend_deploy
        displayName: 前端构建与部署
        nodeVersion: 14.16.0
        commands:
          - set -e
          # 构建前端
          - export NODEJS_HOME=$PWD/.node-v18.20.4
          - wget -q https://npmmirror.com/mirrors/node/v18.20.4/node-v18.20.4-linux-x64.tar.xz -O node-v18.20.4-linux-x64.tar.xz
          - mkdir -p $NODEJS_HOME
          - tar -xJf node-v18.20.4-linux-x64.tar.xz -C $NODEJS_HOME --strip-components=1
          - export PATH=$NODEJS_HOME/bin:$PATH
          - node -v
          - npm -v
          - npm config set registry https://registry.npmmirror.com
          - npm install -g pnpm@9.15.0
          - cd frontend
          - pnpm config set registry https://registry.npmmirror.com
          - pnpm install --frozen-lockfile
          - pnpm run build
          # SSH 配置与部署
          - export SSH_TEST_HOST=47.103.125.229
          - export SSH_TEST_USER=www
          - mkdir -p ~/.ssh
          - echo "" | base64 -d > ~/.ssh/id_rsa
          - chmod 600 ~/.ssh/id_rsa
          - ssh -o StrictHostKeyChecking=no $SSH_TEST_USER@$SSH_TEST_HOST "mkdir -p /www/wwwroot/xingyun/dist"
          - scp -o StrictHostKeyChecking=no -r frontend/dist/* $SSH_TEST_USER@$SSH_TEST_HOST:/www/wwwroot/xingyun/dist/
          - ssh -o StrictHostKeyChecking=no $SSH_TEST_USER@$SSH_TEST_HOST "sudo /www/server/nginx/sbin/nginx -s reload"
