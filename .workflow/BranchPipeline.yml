- step: build@maven
  name: deploy_server
  displayName: 上传并重启服务
  jdkVersion: 8
  mavenVersion: 3.6.3
  commands:
    set -e
    mkdir -p /root/.ssh
    cat > /root/.ssh/id_rsa <<'EOF'
    -----BEGIN OPENSSH PRIVATE KEY-----
    b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
    QyNTUxOQAAACBS0dtv80fNFp1csUFk79rEuWagiDS37UWdPWXiLr252AAAAKBOlxGvTpcR
